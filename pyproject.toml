[project]
name = "fly-notes"
version = "0.1.0"
description = "A minimal floating task widget for Windows 11"
authors = [
    { name = "Antigravity", email = "antigravity@google.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "pytest",
    "pytest-cov>=7.1.0",
]

[project.scripts]
fly-notes = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["fly_notes"]
